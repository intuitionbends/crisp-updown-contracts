[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
via_ir = true
offline = true
remappings = ["forge-std/=lib/forge-std/src/"]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 100
fail_on_revert = true
